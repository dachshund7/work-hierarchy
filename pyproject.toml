[project]
name = "picard-work-hierarchy"
version = "0.6.1"
description = "MusicBrainz Picard 3 plugin that tags classical works with their full work hierarchy, including tracks that contain several movements"
readme = "README.md"
authors = [{ name = "John Hamilton", email = "jlhamilton@gmail.com" }]
license = "GPL-2.0-or-later"
# This is the development environment. The plugin itself runs inside Picard's
# own interpreter (Python 3.10+ for Picard 3), so the plugin's code, at the
# top level of the repository, is kept compatible with that; see the ruff and
# ty target versions below.
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "picard==3.0.2",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "ty>=0.0.89",
]

[tool.uv]
preview = true
# The repository is the plugin, which Picard installs with git, so there is
# no Python package to build.
package = false

[tool.ruff]
target-version = "py310"
line-length = 100
per-file-target-version = { "scripts/**" = "py314", "tests/**" = "py314" }

[tool.ruff.format]
preview = true

[tool.ruff.lint]
preview = true
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Dashes are matched deliberately as separators in work titles, and
# MusicBrainz titles use typographic apostrophes.
allowed-confusables = ["–", "’"]

[tool.ruff.lint.per-file-ignores]
# Picard loads a plugin from its package's __init__.py.
"__init__.py" = ["non-empty-init-module"]

[tool.ty.environment]
python-version = "3.10"

[[tool.ty.overrides]]
# Picard loads the repository as a package, picard.plugins.<directory>, but
# to ty it's the top-level source directory, so the plugin's relative import
# of hierarchy.py can't be resolved.
include = ["__init__.py"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
# For importing hierarchy.py, which doesn't need Picard.
pythonpath = ["."]
