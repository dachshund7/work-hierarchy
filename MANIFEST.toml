long_description = """
Sets work and movement tags from MusicBrainz work relationships, following the
work hierarchy as many levels as it goes (for example opera, act, number) and
handling tracks that contain several movements.

Writes the standard `work`, `movement`, `movementnumber`, `movementtotal` and
`showmovement` tags, plus a `work_hierarchy` tag holding a JSON description of
every work in the track and its path from the top-level work. Performed works
with no composer on MusicBrainz take their parent work's composers. A
`recordingdate` tag says when the recording was made, from the dates
MusicBrainz gives its performances. Each work in the hierarchy says which
work it's an arrangement of, if it is one.

Requires "Use track relationships" in Options > Metadata. The original values
of `work` and `musicbrainz_workid` are kept in the `_recording_work` and
`_recording_workid` script variables.
"""
