"manifest.description" = "Tags classical works with their full work hierarchy, including tracks that contain several movements"
"manifest.long_description" = "Sets work and movement tags from MusicBrainz work relationships, following the\nwork hierarchy as many levels as it goes (for example opera, act, number) and\nhandling tracks that contain several movements.\n\nWrites the standard `work`, `movement`, `movementnumber`, `movementtotal` and\n`showmovement` tags, plus a `work_hierarchy` tag holding a JSON description of\nevery work in the track and its path from the top-level work. Performed works\nwith no composer on MusicBrainz take their parent work's composers.\n\nRequires \"Use track relationships\" in Options > Metadata. The original values\nof `work` and `musicbrainz_workid` are kept in the `_recording_work` and\n`_recording_workid` script variables.\n"
"manifest.name" = "Work Hierarchy"
"options.composer_tags.inherit" = "When a performed work has no composer on MusicBrainz, use its\nnearest parent work's composers"
"options.composer_tags.title" = "Composer tags"
"options.title" = "Work Hierarchy"
"options.work_tag.note" = "The work_hierarchy tag always describes the complete hierarchy."
"options.work_tag.parent_level" = "Parent of the performed work; the movement tag names only that work\n(work: Die Zauberflöte: Akt I, movement: No. 1 Introduktion)"
"options.work_tag.title" = "Work tag"
"options.work_tag.top_level" = "Top-level work; the movement tag names every level below it\n(work: Die Zauberflöte, movement: Akt I: No. 1 Introduktion)"
